name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sampaimana-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sm
          POSTGRES_PASSWORD: sm
          POSTGRES_DB: sampaimana_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sm" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://sm:sm@localhost:5432/sampaimana_test?schema=public
      DATABASE_URL: postgresql://sm:sm@localhost:5432/sampaimana_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate
      - run: pnpm run check
      - name: Unit tests (with coverage)
        run: pnpm test:coverage
      - name: Integration tests
        run: pnpm test:integration

  build:
    name: Build & Push Docker Image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Thinkpad Server
    needs: build
    if: github.event_name != 'pull_request' && github.repository_owner == 'mrfroglab'
    runs-on: self-hosted
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy with Docker Compose
        run: |
          COMPOSE=/opt/stacks/apps/sampaimana/docker-compose.yml
          docker compose -f "$COMPOSE" pull api
          # --no-deps: never touch the database container.
          # The image runs `prisma migrate deploy` (and the idempotent seed) on start.
          docker compose -f "$COMPOSE" up -d --no-deps api
          docker image prune -f
      - name: Verify container is healthy
        run: |
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' sampaimana-api 2>/dev/null || true)
            if [ "$s" = healthy ]; then
              docker exec sampaimana-api node -e "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" \
                && { echo "sampaimana-api healthy and answering on :5000"; exit 0; }
            fi
            sleep 3
          done
          echo "sampaimana-api is not healthy. Check: docker logs sampaimana-api" >&2
          docker logs --tail 50 sampaimana-api >&2 || true
          exit 1
